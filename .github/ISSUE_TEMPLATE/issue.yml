name: "이슈 생성"
description: "작업할 내용을 등록하고, 이슈 생성 시 자동으로 브랜치를 생성합니다."
title: "[FEAT] "
labels: []
body:
  - type: dropdown
    id: scope
    attributes:
      label: "🧩 Scope"
      description: "브랜치명의 <scope>에 사용됩니다."
      options:
        - fe
        - be
        - infra
        - ai
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: "📍 Type"
      description: "브랜치명의 <type>에 사용됩니다."
      options:
        - feature
        - fix
        - hotfix
        - refactor
        - style
        - docs
        - test
        - chore
    validations:
      required: true

  - type: input
    id: short-description
    attributes:
      label: "🌳 Short Description"
      description: "브랜치명의 <short-description>에 사용됩니다. 영어 소문자, 숫자, 하이픈(-)만 사용해주세요."
      placeholder: "login-ui"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📝 Description"
      description: "구현하거나 수정할 내용을 간단히 설명해주세요."
      value: |
        -
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: "✅ Todo"
      description: "작업할 내용을 체크리스트로 작성해주세요."
      value: |
        - [ ] 
    validations:
      required: true
